name: ChunkLoaderBlock
version: 1.1.1-clean
main: com.devin.chunkloader.ChunkLoaderPlugin
api-version: 1.16
author: maskalekseev-code
description: Добавляет чистый блок-прогружатель чанков со спавном мобов из спавнеров в зоне прогрузки.

commands:
  chunkloader:
    description: Управление блоками-прогружателями чанков.
    usage: |
      /<command> give [игрок] - выдать предмет-прогружатель
      /<command> list - список активных прогружателей
      /<command> reload - перезагрузить конфиг и переприменить прогрузку
    aliases: [cloader, cl]
    permission: chunkloader.admin

permissions:
  chunkloader.admin:
    description: Доступ к команде /chunkloader.
    default: op
  chunkloader.place:
    description: Право устанавливать блок-прогружатель.
    default: true
  chunkloader.break:
    description: Право ломать блок-прогружатель.
    default: true
