# Oraxen / Nexo glyph config для кастомного rank-пака.
#
# Установка для Oraxen:
#   - Положить этот файл в /plugins/Oraxen/glyphs/wellsetups_ranks.yml
#   - Положить иконки в /plugins/Oraxen/pack/textures/wellsetups_ranks/*.png
#   - /oraxen reload all
#
# Установка для Nexo (структура та же, путь:
#   /plugins/Nexo/glyphs/wellsetups_ranks.yml
#   /plugins/Nexo/pack/assets/minecraft/textures/wellsetups_ranks/*.png
# )
#
# Кодировки взяты из PUA-блока чтобы не пересекались с Tamil-блоком,
# который использует ваш menu pack.

# ##########
# STAFFS / OWNER
# ##########

